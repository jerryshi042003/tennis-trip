<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Trip</title>
<meta name="theme-color" content="#0b1b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tennis Trip">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #e9eef6;
  --bg2: #dfe6f1;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-strong: rgba(255, 255, 255, 0.72);
  --glass-line: rgba(255, 255, 255, 0.85);
  --edge: rgba(11, 27, 58, 0.08);
  --ink: #0b1b3a;
  --muted: #56627a;
  --navy: #0b1b3a;
  --on-navy: #ffffff;
  --accent-ink: #1d3f7a;
  --shadow: 0 1px 1px rgba(11, 27, 58, 0.04), 0 10px 30px rgba(11, 27, 58, 0.08);
  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060d1c; --bg2: #0b1730;
    --glass: rgba(20, 34, 62, 0.55); --glass-strong: rgba(20, 34, 62, 0.72);
    --glass-line: rgba(255, 255, 255, 0.09); --edge: rgba(0, 0, 0, 0.3);
    --ink: #edf1fa; --muted: #9aa6bf; --navy: #dfe7f7; --on-navy: #0b1b3a; --accent-ink: #a9c1ee;
    --shadow: 0 1px 1px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060d1c; --bg2: #0b1730;
  --glass: rgba(20, 34, 62, 0.55); --glass-strong: rgba(20, 34, 62, 0.72);
  --glass-line: rgba(255, 255, 255, 0.09); --edge: rgba(0, 0, 0, 0.3);
  --ink: #edf1fa; --muted: #9aa6bf; --navy: #dfe7f7; --on-navy: #0b1b3a; --accent-ink: #a9c1ee;
  --shadow: 0 1px 1px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  background-color: var(--bg);
  background-image:
    radial-gradient(60vw 50vh at 85% -10%, color-mix(in srgb, var(--navy) 10%, transparent), transparent 70%),
    radial-gradient(50vw 45vh at -10% 40%, color-mix(in srgb, #6f8fcf 14%, transparent), transparent 70%),
    linear-gradient(180deg, var(--bg), var(--bg2));
  background-attachment: fixed;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid var(--glass-line);
}

/* Header + tabs: one frosted bar */
.top {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
  border-bottom: 1px solid var(--edge);
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px 10px; }
.head h1 { margin: 0; font-weight: 700; font-size: 1.6rem; letter-spacing: -0.015em; line-height: 1.1; }
.sent-link { appearance: none; border: 0; background: none; padding: 6px 0; cursor: pointer; font-size: 1rem; text-decoration: underline; text-underline-offset: 4px; color: var(--ink); white-space: nowrap; }
.sent-link[aria-pressed="true"] { font-weight: 700; }
.sent-link small { font-family: var(--mono); font-size: 0.75rem; margin-left: 4px; }
.seg { padding-block: 2px 12px; }
.seg-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 999px; max-width: 660px; margin: 0 auto; box-shadow: var(--shadow); }
.seg button { appearance: none; border: 0; background: transparent; border-radius: 999px; min-height: 44px; padding: 8px 6px; cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.seg button small { font-family: var(--mono); font-size: 0.72rem; font-weight: 500; opacity: 0.8; margin-left: 5px; letter-spacing: 0; }

/* Board */
main .wrap { padding-block: 20px calc(64px + env(safe-area-inset-bottom)); }
.grid { display: grid; gap: 24px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (min-width: 1800px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1099px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; } }
@media (max-width: 649px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.empty { color: var(--muted); padding: 40px 0; text-align: center; grid-column: 1 / -1; margin: 0; }

/* Card */
.card { border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); }
.media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: color-mix(in srgb, var(--navy) 8%, transparent); }
.media img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }
.media.fit .bg { position: absolute; inset: -20%; width: 140%; height: 140%; object-fit: cover; filter: blur(28px) saturate(140%); opacity: 0.85; }
.media.fit .fg { position: relative; object-fit: contain; padding: 8%; }
.media .handle {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
  padding: 44px 16px 12px; color: #fff; font-weight: 600; font-size: 0.92rem;
  background: linear-gradient(to top, rgba(4, 10, 24, 0.68), rgba(4, 10, 24, 0));
}
.media.word { display: grid; place-items: center; background:
  radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, #6f8fcf 35%, transparent), transparent 60%),
  linear-gradient(160deg, #0b1b3a, #1d3f7a); }
.media.word span { font-family: var(--display); font-weight: 900; font-size: clamp(2.6rem, 9cqi, 4.4rem); letter-spacing: 0.02em; color: rgba(255,255,255,0.92); text-transform: uppercase; line-height: 1; text-align: center; padding: 0 16px; }
.media.word .date { position: absolute; left: 16px; bottom: 12px; font-family: var(--body); font-size: 0.92rem; font-weight: 600; color: rgba(255,255,255,0.9); letter-spacing: 0; text-transform: none; padding: 0; }
.card { container-type: inline-size; }

.info { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.95rem; line-height: 0.95; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
.status { flex: none; font-family: var(--mono); font-size: 0.74rem; color: var(--muted); white-space: nowrap; }
.meta { margin: -4px 0 0; color: var(--muted); font-size: 0.95rem; }
.meta b { color: var(--ink); font-weight: 600; }
.act { border-top: 1px solid var(--edge); padding-top: 12px; }
.lbl { margin: 0 0 4px; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
.draft { margin: 0; font-weight: 600; font-size: 1rem; line-height: 1.4; white-space: pre-line; overflow-wrap: anywhere; }
.draft.long { font-weight: 500; font-size: 0.95rem; }
.alt { margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
.chip { appearance: none; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer; font-size: 0.86rem; font-weight: 600; min-height: 36px; padding: 6px 13px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); background: var(--glass-strong); color: var(--ink); transition: border-color .15s, background .15s; }
.chip:hover { border-color: var(--navy); }
.chip svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chip.primary { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.chip.sent { margin-left: auto; }
.chip.sent[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.chip.done { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 40; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 0.92rem; background: var(--navy); color: var(--on-navy); box-shadow: var(--shadow); transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 649px) {
  .head h1 { font-size: 1.35rem; }
  .seg button { font-size: 1rem; letter-spacing: 0.01em; }
  .seg button small { font-size: 0.64rem; margin-left: 3px; }
  main .wrap { padding-top: 16px; }
  .card h3 { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-strong); }
  .top { background: var(--bg); }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap head">
    <h1>Tennis Trip</h1>
    <button class="sent-link" type="button" id="sent-link" aria-pressed="false">Sent<small id="n-sent">0</small></button>
  </div>
  <nav class="wrap seg" aria-label="Lists">
    <div class="seg-track glass">
      <button type="button" data-tab="ph" aria-pressed="true">Philippines<small id="n-ph"></small></button>
      <button type="button" data-tab="jp" aria-pressed="false">Japan<small id="n-jp"></small></button>
      <button type="button" data-tab="plan" aria-pressed="false">Plan<small id="n-plan"></small></button>
    </div>
  </nav>
</header>

<main><div class="wrap"><div class="grid" id="grid"></div></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const KEY = 'tennis-trip-sent-v1';
  const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } };
  const save = s => { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch (e) {} };
  let sent = load();
  let tab = 'ph', showSent = false;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ICON = {
    Instagram: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>',
    Map: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    Copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    Email: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    Call: '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>'
  };
  const iconFor = l => ICON[l] || '';

  const linkHref = (item, l) => {
    if (l.label === 'Email' && item.subject) return l.url + '?subject=' + encodeURIComponent(item.subject) + '&body=' + encodeURIComponent(item.send);
    return l.url;
  };

  const media = (item, list) => {
    if (list === 'plan') {
      return `<div class="media word"><span>${esc(item.big)}</span>${item.date ? `<span class="date">${esc(item.date)}</span>` : ''}</div>`;
    }
    if (!item.img) {
      return `<div class="media word"><span>${esc(item.city)}</span>${item.handle ? `<span class="handle">@${esc(item.handle)}</span>` : ''}</div>`;
    }
    const src = 'img/' + encodeURIComponent(item.img);
    const cap = item.handle ? `<span class="handle">@${esc(item.handle)}</span>` : '';
    if (item.fit === 'contain') {
      return `<div class="media fit"><img class="bg" src="${src}" alt="" aria-hidden="true" loading="lazy"><img class="fg" src="${src}" alt="${esc(item.name)}" loading="lazy">${cap}</div>`;
    }
    return `<div class="media"><img src="${src}" alt="${esc(item.name)}" loading="lazy">${cap}</div>`;
  };

  const card = (item, list) => {
    const isPlan = list === 'plan';
    const draft = item.send || item.text || '';
    const long = draft.length > 260;
    const meta = isPlan ? esc(item.line) : `${esc(item.city)} · ${esc(item.role)}`;
    const links = (item.links || []).map((l, i) => {
      const primary = i === 0 && (l.label === 'Instagram' || l.label === 'Email') ? ' primary' : '';
      const ext = /^https?:/.test(l.url) ? ' target="_blank" rel="noopener"' : '';
      return `<a class="chip${primary}" href="${esc(linkHref(item, l))}"${ext}>${iconFor(l.label)}${esc(l.label)}</a>`;
    }).join('');
    const copy = item.send ? `<button class="chip" type="button" data-copy="send">${ICON.Copy}Copy</button>` : '';
    const copyAlt = item.alt ? `<button class="chip" type="button" data-copy="alt">${ICON.Copy}Copy ${esc(item.alt.label)}</button>` : '';
    const sentBtn = !isPlan ? `<button class="chip sent" type="button" data-sent aria-pressed="${sent.has(item.id)}">Sent</button>` : '';
    const alt = item.alt ? `<div class="alt"><p class="lbl">${esc(item.alt.label)}</p><p class="draft long">${esc(item.alt.send)}</p></div>` : '';
    return `<article class="card glass" data-id="${esc(item.id)}" data-list="${list}">
      ${media(item, list)}
      <div class="info">
        <div class="title-row"><h3>${esc(item.name)}</h3>${item.status ? `<span class="status">${esc(item.status)}</span>` : ''}</div>
        <p class="meta">${meta}</p>
        ${draft ? `<div class="act"><p class="lbl">${esc(item.action || 'SEND')}</p><p class="draft${long ? ' long' : ''}">${esc(draft)}</p>${alt}</div>` : ''}
        <div class="chips">${links}${copy}${copyAlt}${sentBtn}</div>
      </div>
    </article>`;
  };

  const grid = document.getElementById('grid');
  const find = (list, id) => DATA[list].find(x => x.id === id);

  const render = () => {
    let html = '';
    if (showSent) {
      ['ph', 'jp'].forEach(list => DATA[list].filter(x => sent.has(x.id)).forEach(x => { html += card(x, list); }));
      if (!html) html = '<p class="empty">Nothing marked sent yet.</p>';
    } else if (tab === 'plan') {
      DATA.plan.forEach(x => { html += card(x, 'plan'); });
    } else {
      DATA[tab].filter(x => !sent.has(x.id)).forEach(x => { html += card(x, tab); });
      if (!html) html = '<p class="empty">All sent.</p>';
    }
    grid.innerHTML = html;
    document.getElementById('n-ph').textContent = DATA.ph.filter(x => !sent.has(x.id)).length;
    document.getElementById('n-jp').textContent = DATA.jp.filter(x => !sent.has(x.id)).length;
    document.getElementById('n-plan').textContent = DATA.plan.length;
    document.getElementById('n-sent').textContent = [...DATA.ph, ...DATA.jp].filter(x => sent.has(x.id)).length;
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(!showSent && b.dataset.tab === tab)));
    document.getElementById('sent-link').setAttribute('aria-pressed', String(showSent));
  };

  const toast = (() => { const el = document.getElementById('toast'); let t; return msg => { el.textContent = msg; el.classList.add('on'); clearTimeout(t); t = setTimeout(() => el.classList.remove('on'), 1400); }; })();

  const copyText = async text => {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove(); return ok;
    }
  };

  grid.addEventListener('click', async e => {
    const el = e.target.closest('[data-copy],[data-sent]');
    if (!el) return;
    const c = el.closest('.card'), item = find(c.dataset.list, c.dataset.id);
    if (el.dataset.copy !== undefined) {
      const text = el.dataset.copy === 'alt' ? item.alt.send : item.send;
      const ok = await copyText(text);
      el.classList.toggle('done', ok);
      toast(ok ? 'Copied' : 'Copy failed');
      setTimeout(() => el.classList.remove('done'), 1200);
    } else {
      sent.has(item.id) ? sent.delete(item.id) : sent.add(item.id);
      save(sent);
      toast(sent.has(item.id) ? 'Moved to Sent' : 'Back in ' + (c.dataset.list === 'ph' ? 'Philippines' : 'Japan'));
      render();
    }
  });

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab; showSent = false; render();
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
    window.scrollTo({ top: 0 });
  }));
  document.getElementById('sent-link').addEventListener('click', () => { showSent = !showSent; render(); window.scrollTo({ top: 0 }); });

  const h = location.hash.slice(1);
  if (['ph', 'jp', 'plan'].includes(h)) tab = h;
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
